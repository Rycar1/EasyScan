rules:
    - id: builtin-0390
      name: Barracuda
      category: waf
      tags:
        - migrated
        - waf
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: favicon.hash
                  value: "1436966696"
                  weight: 100
                  evidence: Migrated favicon hash evidence for Barracuda
      negative:
        - type: body.contains
          value: Barracuda documentation
          reason: Documentation pages can mention Barracuda without being a deployed WAF.
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: medium

