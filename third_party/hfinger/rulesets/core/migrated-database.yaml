rules:
    - id: builtin-0073
      name: Influxdb
      category: database
      tags:
        - migrated
        - database
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: header.contains
                  value: X-Influxdb
                  weight: 100
                  evidence: Migrated HTTP header evidence for Influxdb
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: medium

