rules:
    - id: builtin-0067
      name: 天融信VPN设备
      category: security-device
      tags:
        - migrated
        - security-device
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: header.contains
                  value: topsecsvportalname
                  weight: 100
                  evidence: Migrated HTTP header evidence for 天融信VPN设备
      negative:
        - type: body.contains
          value: 天融信VPN设备 漏洞
          reason: Vulnerability articles can mention this VPN without being a deployed device.
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: medium

