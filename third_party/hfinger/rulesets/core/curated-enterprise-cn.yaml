rules:
  - id: core-cn2-0001-ecology
    name: Weaver e-cology
    category: oa
    vendor: Weaver
    priority: 88
    tags: [weaver, ecology, oa, java]
    match:
      strategy: any
      probes:
        - id: ecology-signals
          matchers:
            - type: cookie.contains
              value: ecology_JSessionId
              weight: 100
              evidence: e-cology session cookie
            - type: body.contains
              value: "/wui/common/css/w7ovfont.css"
              weight: 100
              evidence: e-cology WUI font stylesheet
            - type: body.contains
              value: "/theme/ecology8/"
              weight: 90
              evidence: e-cology theme asset path
            - type: body.contains
              value: "weaver_lang"
              weight: 80
              evidence: e-cology language pack marker
    metadata:
      references: ["https://www.weaver.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - header: {Set-Cookie: "ecology_JSessionId=abc; path=/"}

  - id: core-cn2-0002-eoffice
    name: Weaver e-office
    category: oa
    vendor: Weaver
    priority: 85
    tags: [weaver, eoffice, oa, php]
    match:
      strategy: any
      probes:
        - id: eoffice-signals
          matchers:
            - type: body.contains
              value: "/general/login/view/images/updateload.gif"
              weight: 100
              evidence: e-office login asset path
            - type: body.contains
              value: "iSignaturePortal"
              weight: 90
              evidence: e-office signature portal marker
    metadata:
      references: ["https://www.weaver.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: medium
    examples:
      positive:
        - body: '<img src="/general/login/view/images/updateload.gif">'

  - id: core-cn2-0003-emobile
    name: Weaver e-mobile
    category: oa
    vendor: Weaver
    priority: 85
    tags: [weaver, emobile, oa]
    match:
      strategy: any
      probes:
        - id: emobile-signals
          matchers:
            - type: body.regex
              value: 'content="[Ww]eaver [Ee]-mobile"'
              weight: 100
              evidence: e-mobile generator meta tag
            - type: body.contains
              value: 'window.apiprifix = "/emp"'
              weight: 90
              evidence: e-mobile api prefix marker
    metadata:
      references: ["https://www.weaver.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: medium
    examples:
      positive:
        - body: '<meta name="description" content="Weaver E-mobile">'

  - id: core-cn2-0004-landray
    name: Landray OA
    category: oa
    vendor: Landray
    priority: 85
    tags: [landray, oa, java]
    match:
      strategy: any
      probes:
        - id: landray-signals
          matchers:
            - type: body.contains
              value: "/scripts/jquery.landray.common.js"
              weight: 100
              evidence: Landray common script path
            - type: body.contains
              value: "lui_login_message_td"
              weight: 90
              evidence: Landray login message element
            - type: body.contains
              value: "蓝凌软件"
              weight: 90
              evidence: Landray vendor brand
    metadata:
      references: ["https://www.landray.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - body: '<script src="/scripts/jquery.landray.common.js"></script>'

  - id: core-cn2-0005-yonyou-nc
    name: Yonyou NC
    category: erp
    vendor: Yonyou
    priority: 85
    tags: [yonyou, erp, nc, java]
    match:
      strategy: any
      probes:
        - id: yonyou-nc-signals
          matchers:
            - type: body.contains
              value: "/nc/servlet/nc.ui.iufo.login.index"
              weight: 100
              evidence: Yonyou NC login servlet path
            - type: body.contains
              value: "url=nccloud"
              weight: 90
              evidence: Yonyou NC Cloud redirect
            - type: body.contains
              value: "ufida_nc.png"
              weight: 90
              evidence: Yonyou NC logo asset
    metadata:
      references: ["https://www.yonyou.com/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - body: '<a href="/nc/servlet/nc.ui.iufo.login.index">login</a>'

  - id: core-cn2-0006-yonyou-u8
    name: Yonyou U8/GRP-U8
    category: erp
    vendor: Yonyou
    priority: 85
    tags: [yonyou, erp, u8]
    match:
      strategy: any
      probes:
        - id: yonyou-u8-signals
          matchers:
            - type: body.contains
              value: "用友GRP-U8"
              weight: 100
              evidence: Yonyou GRP-U8 brand
            - type: body.contains
              value: "开启U8 Cloud云端之旅"
              weight: 100
