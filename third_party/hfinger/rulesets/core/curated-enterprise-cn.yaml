  - id: core-cn2-0012-maccms
    name: MacCMS
    category: cms
    vendor: MacCMS
    priority: 80
    tags: [maccms, cms, php]
    match:
      strategy: any
      probes:
        - id: maccms-signals
          matchers:
            - type: body.contains
              value: 'var maccms={"path'
              weight: 100
              evidence: MacCMS runtime config object
    metadata:
      references: ["https://github.com/0x727/FingerprintHub"]
      confidence: medium
    examples:
      positive:
        - body: '<script>var maccms={"path":"/"}</script>'

  - id: core-cn2-0013-sangfor
    name: Sangfor Device
    category: security-device
    vendor: Sangfor
    priority: 85
    tags: [sangfor, firewall, vpn, security]
    match:
      strategy: any
      probes:
        - id: sangfor-signals
          matchers:
            - type: cookie.contains
              value: sangfor_session_hash
              weight: 100
              evidence: Sangfor session cookie
            - type: body.contains
              value: "/por/login_psw.csp"
              weight: 100
              evidence: Sangfor SSL VPN login endpoint
            - type: body.contains
              value: "sec.sangfor.com.cn"
              weight: 90
              evidence: Sangfor vendor domain reference
            - type: title.contains
              value: aTrust
              weight: 80
              evidence: Sangfor aTrust zero-trust gateway
    metadata:
      references: ["https://www.sangfor.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - body: '<a href="/por/login_psw.csp">login</a>'

  - id: core-cn2-0014-ruijie
    name: Ruijie Device
    category: security-device
    vendor: Ruijie
    priority: 82
    tags: [ruijie, network-device, router, firewall]
    match:
      strategy: any
      probes:
        - id: ruijie-signals
          matchers:
            - type: header.regex
              key: Server
              value: (?i)rgos http-server
              weight: 100
              evidence: Ruijie RGOS server banner
            - type: body.contains
              value: "/wnm/ssl/web/frame/login.html"
              weight: 100
              evidence: Ruijie web management login path
            - type: body.contains
              value: "锐捷网络"
              weight: 70
              evidence: Ruijie vendor brand
            - type: cookie.contains
              value: rjsslvpn_encookie
              weight: 90
              evidence: Ruijie SSL VPN cookie
    metadata:
      references: ["https://www.ruijie.com.cn/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - header: {Server: "RGOS Http-Server"}

