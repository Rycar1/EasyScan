  - id: core-cn2-0007-kingdee
    name: Kingdee
    category: erp
    vendor: Kingdee
    priority: 85
    tags: [kingdee, erp]
    match:
      strategy: any
      probes:
        - id: kingdee-signals
          matchers:
            - type: body.contains
              value: "金蝶国际软件集团有限公司版权所有"
              weight: 100
              evidence: Kingdee copyright text
            - type: body.contains
              value: "logo-kingdee.png"
              weight: 90
              evidence: Kingdee logo asset
            - type: body.contains
              value: "Kingdee.BOS.XPF.App.xap"
              weight: 100
              evidence: Kingdee Cloud Galaxy Silverlight app
            - type: cookie.contains
              value: EASSESSIONID
              weight: 70
              evidence: Kingdee EAS session cookie
    metadata:
      references: ["https://www.kingdee.com/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - body: '金蝶国际软件集团有限公司版权所有'

  - id: core-cn2-0008-finereport
    name: FineReport
