rules:
  - id: core-cn3-0001-hillstone-firewall
    name: Hillstone 山石网科防火墙
    category: security-device
    vendor: Hillstone
    priority: 85
    tags: [hillstone, firewall, security-device, cn]
    match:
      strategy: any
      probes:
        - id: hillstone-signals
          matchers:
            - type: body.contains
              value: "hillstone stoneos software version"
              weight: 100
              evidence: Hillstone StoneOS version banner
            - type: body.contains
              value: "GLOBAL_CONFIG.js"
              weight: 40
              evidence: Hillstone console config script
            - type: body.contains
              value: 'href="resources/login-all.css"'
              weight: 70
              evidence: Hillstone HSA login stylesheet
    metadata:
      references: ["https://www.hillstonenet.com/", "https://github.com/0x727/FingerprintHub"]
      confidence: high
    examples:
      positive:
        - body: 'Hillstone StoneOS Software Version'

