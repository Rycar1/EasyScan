    - id: builtin-0006
      name: 致远互联-协同数据分析云
      category: oa
      tags:
        - migrated
        - oa
      match:
        strategy: all
        probes:
            - id: default
              matchers:
                - type: favicon.hash
                  value: "410106848"
                  weight: 100
                  evidence: Migrated favicon hash evidence for 致远互联-协同数据分析云
      negative:
        - type: body.contains
          value: 致远互联 协同数据分析云 漏洞
          reason: Vulnerability articles can mention this product without being a deployed OA system.
      metadata:
        references:
            - builtin:migrated-legacy-rule
        confidence: medium

